[project]
name = "flaky-detective"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anuj_jha", email = "anuj@instaastro.in" }
]
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
flaky-detective = "flaky_detective:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
pythonpath = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]

